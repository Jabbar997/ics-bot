mode: paper_only

capital:
  initial_capital_usd: 266.0
  base_currency: USD

risk:
  max_open_positions: 3
  max_position_size_pct: 10
  weekly_loss_limit_pct: 5
  monthly_loss_limit_pct: 12
  max_drawdown_limit_pct: 15
  minimum_dqs: 70
  target_average_dqs: 75
  stop_loss_atr_multiplier: 2
  absolute_stop_loss_pct: 7

benchmark:
  symbol: SPY

# Core-satellite (ICS-DOC-004 amendment, approved 2026-08-23).
# The core deploys idle cash into the diversified benchmark; the tactical layer
# (3 x 10%) runs on top of it unchanged. Core + tactical never exceeds
# max_total_deployment_pct — no leverage, ever.
# NOTE: disabled by default. The approval to enable it at 50% was given on
# projected numbers (+73.00% / -12.93% / Sharpe 1.20) that a database-isolation
# bug later invalidated. Measured cleanly it is +37.36% / -10.95% / Sharpe 0.98.
# Re-enable only after an explicit decision on the corrected figures.
core_allocation:
  enabled: false
  symbol: SPY
  target_pct: 50
  rebalance_band_pct: 5
  max_total_deployment_pct: 85
  liquidate_on_kill_level: 3

market:
  data_provider: yfinance
  timeframe: 1d
  history_years: 5
  timezone: America/New_York

paper:
  commission_per_trade_usd: 0.0
  slippage_pct: 0.0
  allow_fractional_shares: true

telegram:
  enabled: true
  allowed_user_ids: []
  daily_report_time_ksa: "01:15"
  weekly_report_day: "FRI"
  status_report_time_ksa: "13:00"

watchlist:
  - SPY
  - QQQ
  - VTI
  - SCHD
  - AAPL
  - MSFT
  - NVDA
  - AMZN
  - GOOGL
  - META
  - TSLA
  - AVGO
  - COST
  - JPM
  - XOM
  - JNJ
  - PG
  - KO
  - UNH
  - CAT

forbidden_assets:
  - crypto
  - options
  - futures
  - forex
  - penny_stocks
  - leverage
  - short_selling
